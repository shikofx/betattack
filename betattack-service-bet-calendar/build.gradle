group "$applicationGroup"
version "$applicationVersion"

wrapper {
    gradleVersion = '5.4'
}

allprojects {
    repositories {
        mavenCentral()
        mavenLocal()
        jcenter()
    }
//   
}

apply plugin: 'java'

dependencies {
    testCompile group: 'junit', name: 'junit', version: '4.12'
    compile group: 'com.opencsv', name: 'opencsv', version: '4.6'
}

subprojects{
    apply plugin: 'java'
    apply plugin: 'idea'

    sourceCompatibility = 1.8
    targetCompatibility = 1.8


}
